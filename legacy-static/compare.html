<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>LSA A/B Compare</title>
<style>
  body{margin:0;background:#e5e7eb;font:500 14px/1.4 system-ui,sans-serif;color:#111827}
  header{padding:16px 24px;display:flex;gap:16px;align-items:center;flex-wrap:wrap}
  header h1{font-size:16px;margin:0}
  header button{font:inherit;padding:8px 14px;border:1px solid #6b7280;background:#fff;border-radius:6px;cursor:pointer}
  header button[aria-pressed=true]{background:#111827;color:#fff;border-color:#111827}
  .grid{display:flex;gap:24px;padding:0 24px 24px;overflow-x:auto}
  figure{margin:0;flex:none}
  figcaption{font-weight:700;margin-bottom:8px}
  iframe{border:1px solid #9ca3af;background:#fff;display:block;border-radius:8px}
  .m iframe{width:390px;height:844px}
  .d iframe{width:1280px;height:800px}
</style>
</head>
<body>
<header>
  <h1>LSA redesign — A vs B</h1>
  <button data-mode="m" aria-pressed="true">Mobile 390px</button>
  <button data-mode="d" aria-pressed="false">Desktop 1280px</button>
</header>
<div class="grid m" id="grid">
  <figure><figcaption>A · Refined</figcaption><iframe src="demo.html?theme=refined" title="Direction A"></iframe></figure>
  <figure><figcaption>B · Ledger</figcaption><iframe src="demo.html?theme=ledger" title="Direction B"></iframe></figure>
</div>
<script>
  document.querySelectorAll('header button').forEach(b => b.onclick = () => {
    document.querySelectorAll('header button').forEach(x => x.setAttribute('aria-pressed', x === b));
    document.getElementById('grid').className = 'grid ' + b.dataset.mode;
  });
</script>
</body>
</html>
